AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: service-platform core - Cognito (ユーザープールと web ACL) / 台帳と監査のテーブル / SES / 通知キュー / notifier / 添付バケットと、それらを渡す SSM パラメータ

# 前提: shared スタックが先にデプロイ済みであること（SSM /service-platform/{env}/shared/layer-arn を読む）

Parameters:
  ProjectName:
    Type: String
    Default: service-platform
  Env:
    Type: String
    AllowedValues:
      - dev
      - prod
    Default: dev
  LogLevel:
    Type: String
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
    Default: INFO
  ExamplePowertoolsLayerArn:
    Type: String
    Default: arn:aws:lambda:ap-northeast-1:210000000001:layer:ExamplePowertoolsPython:1
    Description: 任意の追加レイヤ ExamplePowertoolsPython の ARN。notifier が LambdaLogger のために参照する
  PowertoolsLayerArn:
    Type: String
    Description: AWS 提供の Powertools for AWS Lambda (Python) レイヤ ARN。samconfig で環境ごとに指定する
  SharedLayerArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /service-platform/dev/shared/layer-arn
    Description: shared スタックが書く共通レイヤ ARN の取り決めのキー。prod は samconfig でキー名を上書きする
  HostedZoneId:
    Type: String
    Default: Z0EXAMPLEZONE0
    Description: example-cloud.com の Route53 ホストゾーン ID。SES の DNS 検証レコードを追加する
  MailDomain:
    Type: String
    Default: service-platform-dev.example-cloud.com
    Description: 通知メールの送信ドメイン (dev service-platform-dev.example-cloud.com / prod service-platform.example-cloud.com)
  OpsEmail:
    Type: String
    Default: devA@example.co.jp
    Description: DLQ アラームと SES のバウンス・苦情を受け取る基盤担当のメールアドレス
  CognitoEmailSendingAccount:
    Type: String
    AllowedValues:
      - COGNITO_DEFAULT
      - DEVELOPER
    Default: COGNITO_DEFAULT
    Description: >-
      Cognito のメール送信元（設計 6.4）。DEVELOPER は SES Identity が検証済みでないと
      デプロイに失敗するため、新規スタックは COGNITO_DEFAULT で立ち上げ、DNS 検証後に
      samconfig を DEVELOPER にして再デプロイする。サインインの要素 EMAIL_OTP も
      DEVELOPER のときだけ入れる（SES の送信が前提のため）
  SiteDomain:
    Type: String
    Default: service-platform-dev.example-cloud.com
    Description: サイトの FQDN。パスキーの RP ID と招待メールのリンクに使う。RP ID は後から変えない (dev service-platform-dev.example-cloud.com / prod service-platform.example-cloud.com)
  UserPoolRateLimit:
    Type: Number
    Default: 300
    MinValue: 10
    Description: ユーザープールの web ACL で IP ごとの要求の上限 (5 分あたり)。超過要求を遮断する

Conditions:
  IsProd: !Equals [!Ref Env, prod]
  UseSesForCognitoEmail: !Equals [!Ref CognitoEmailSendingAccount, DEVELOPER]

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    MemorySize: 256
    Timeout: 30
    PropagateTags: true
    Tags:
      Project: !Ref ProjectName
      Name: Function

Resources:
  # 旧プール (論理 ID UserPool) は email を必須で作っており、必須かどうかは作成後に変えられない。
  # 論理 ID を替えてプールを作り直させた（計画の判断 1）。この ID をまた替えるとプールが作り直され、
  # 利用者・パスキー・クライアント ID が全部変わる（設計 4.1 の弱参照の注意）。
  SignInUserPool:
    Type: AWS::Cognito::UserPool
    UpdateReplacePolicy: Retain
    # DEVELOPER でのメール送信は SES Identity を参照するため、Identity より後に作る。
    DependsOn: EmailIdentity
    Metadata:
      cfn-lint:
        config:
          # 置換を伴う更新からだけ守る。スタック削除時は dev の後片付けのため消す
          # （prod は DeletionProtection: ACTIVE が削除そのものを止める。設計 6.4）
          ignore_checks:
            - W3011
    Properties:
      UserPoolName: !Sub ${ProjectName}-${Env}
      UserPoolTier: ESSENTIALS
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      # 必須の属性はどのクライアントからも書けるので、email を必須にしない（ADR D2）
      Schema:
        - Name: email
          AttributeDataType: String
          Required: false
          Mutable: true
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      Policies:
        # パスワードを持つのは admin だけ。一時パスワードは社内の別経路で渡す（計画 3 章）
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
        SignInPolicy:
          AllowedFirstAuthFactors: !If
            - UseSesForCognitoEmail
            - - PASSWORD
              - WEB_AUTHN
              - EMAIL_OTP
            - - PASSWORD
              - WEB_AUTHN
      WebAuthnRelyingPartyID: !Ref SiteDomain
      WebAuthnUserVerification: required
      WebAuthnFactorConfiguration: MULTI_FACTOR_WITH_USER_VERIFICATION
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      # COGNITO_DEFAULT で独自 From を使うには SES の送信認可ポリシーが別途要るため、
      # 切替前は既定の no-reply@verificationemail.com のままにする（設計 6.4）。
      EmailConfiguration: !If
        - UseSesForCognitoEmail
        - EmailSendingAccount: DEVELOPER
          From: !Sub SERVICE-PLATFORM <noreply@${MailDomain}>
          SourceArn: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${MailDomain}
          ConfigurationSet: !Ref SesConfigurationSet
        - EmailSendingAccount: COGNITO_DEFAULT
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn
        CustomMessage: !GetAtt CustomMessageFunction.Arn
      UserPoolTags:
        Project: !Ref ProjectName
        Name: UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${ProjectName}-spa-${Env}
      UserPoolId: !Ref SignInUserPool
      GenerateSecret: false
      # admin のパスワードも USER_AUTH (PASSWORD_SRP) で入るので ALLOW_USER_SRP_AUTH は要らない（計画の判断 6）。
      # rotation と ALLOW_REFRESH_TOKEN_AUTH は併用できない（ADR 判断 14）
      ExplicitAuthFlows:
        - ALLOW_USER_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AuthSessionValidity: 10
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 1440
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: minutes
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 30
      # 利用者に email と email_verified を書かせない（ADR D2）。Cognito は書ける属性が
      # 読める属性に含まれないクライアントを作らないので、読める属性に name も入れる
      ReadAttributes:
        - email
        - email_verified
        - name
      WriteAttributes:
        - name

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref SignInUserPool
      Description: 利用者の管理と許可の台帳の操作を許す管理者グループ。TOTP と別経路の確認を経て有効にする
      Precedence: 1

  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-core-pre-signup-${Env}
      Description: 招待 (AdminCreateUser) 以外からの利用者の作成を拒む
      CodeUri: src/pre_signup/
      Handler: app.handler

  PreSignUpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PreSignUpFunction}
      RetentionInDays: 365
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: LogGroup

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt SignInUserPool.Arn

  CustomMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-core-custom-message-${Env}
      Description: 招待とメールのコードの文面を日本語にする
      CodeUri: src/custom_message/
      Handler: app.handler
      Environment:
        Variables:
          SITE_URL: !Sub https://${SiteDomain}/

  CustomMessageLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CustomMessageFunction}
      RetentionInDays: 365
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: LogGroup

  CustomMessagePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CustomMessageFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt SignInUserPool.Arn

  # ユーザープールの公開 API の前に置く web ACL（ADR D9、判断 15）
  UserPoolWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub ${ProjectName}-userpool-${Env}
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${ProjectName}-userpool-${Env}
      Rules:
        # お客様のパスワードの後付けを止める。admin の招待・TOTP の登録・AdminSetUserPassword は通る（PoC 14）
        - Name: change-password
          Priority: 0
          Action:
            Block: {}
          Statement:
            ByteMatchStatement:
              FieldToMatch:
                SingleHeader:
                  Name: x-amz-target
              PositionalConstraint: EXACTLY
              SearchString: AWSCognitoIdentityProviderService.ChangePassword
              TextTransformations:
                - Priority: 0
                  Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: change-password
        - Name: rate-per-ip
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref UserPoolRateLimit
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-per-ip
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: WebAcl

  UserPoolWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !GetAtt SignInUserPool.Arn
      WebACLArn: !GetAtt UserPoolWebAcl.Arn

  # WAF のログのロググループ名は aws-waf-logs- で始める必要がある
  UserPoolWebAclLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub aws-waf-logs-${ProjectName}-userpool-${Env}
      RetentionInDays: 365
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: LogGroup

  UserPoolWebAclLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt UserPoolWebAcl.Arn
      # WAF は GetAtt の Arn (末尾 :*) を受け付けないので組み立てる
      LogDestinationConfigs:
        - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${UserPoolWebAclLogGroup}
      # WAF の対象アクションに一致した要求を記録する
      LoggingFilter:
        DefaultBehavior: DROP
        Filters:
          - Behavior: KEEP
            Requirement: MEETS_ANY
            Conditions:
              - ActionCondition:
                  Action: BLOCK
              - ActionCondition:
                  Action: COUNT

  # 土台の台帳（ADR D4、計画 2.1）。請求の実績の基礎なので dev も Retain
  LedgerTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ProjectName}-core-ledger-${Env}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # 一覧の画面のためだけに使う（結果整合で足りるもの）。認可の判断には使わない
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: Table

  # 監査（ADR D12、計画 2.2）。各サービスには PutItem だけを渡す
  AuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ProjectName}-core-audit-${Env}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # 通信機アカウントで引く
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # 日ごとに時系列で引く
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      # 操作の記録は 365 日。請求の実績の基礎になる記録には ttl を付けない
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: Table

  LedgerTableNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ProjectName}/${Env}/ledger/table-name
      Type: String
      Value: !Ref LedgerTable
      Description: 台帳のテーブル名。台帳を読み書きするサービスと運用スクリプトが読む（設計 4.2）

  AuditTableNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ProjectName}/${Env}/audit/table-name
      Type: String
      Value: !Ref AuditTable
      Description: 監査のテーブル名。全サービス (PutItem だけ) と運用スクリプトが読む（設計 4.2）

  UserPoolIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ProjectName}/${Env}/cognito/user-pool-id
      Type: String
      Value: !Ref SignInUserPool
      Description: User Pool ID。frontend のビルドと運用スクリプトが読む

  UserPoolClientIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ProjectName}/${Env}/cognito/client-id
      Type: String
      Value: !Ref UserPoolClient
      Description: SPA 用 App Client ID。app の JWT audience と frontend のビルドが読む

  UserPoolIssuerParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ProjectName}/${Env}/cognito/issuer
      Type: String
      Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${SignInUserPool}
      Description: app の JWT authorizer が検証する issuer

  NotifyQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-notify-queue-${Env}
      VisibilityTimeout: 360
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotifyDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: Queue

  NotifyDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-notify-dlq-${Env}
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: Queue

  OpsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ProjectName}-ops-${Env}
      DisplayName: SERVICE-PLATFORM ops
      Subscription:
        - Endpoint: !Ref OpsEmail
          Protocol: email
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: Topic

  OpsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref OpsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountOwner
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:AddPermission
              - sns:RemovePermission
              - sns:DeleteTopic
              - sns:Subscribe
              - sns:ListSubscriptionsByTopic
              - sns:Publish
            Resource: !Ref OpsTopic
          - Sid: AllowSesPublish
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OpsTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowCloudWatchAlarmPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OpsTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  OpsTopicArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ProjectName}/${Env}/ops/topic-arn
      Type: String
      Value: !Ref OpsTopic
      Description: 運用通知トピックの ARN。アプリのアラームが AlarmActions の宛先として読む

  NotifyDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-notify-dlq-${Env}
      AlarmDescription: notify-dlq にメッセージが入った。原因を解消してから DLQ 再駆動で元キューへ戻す
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotifyDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsTopic
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: Alarm

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-core-idempotency-${Env}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiration
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: Table

  AttachmentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${ProjectName}-attachments-${Env}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # 再実行は同じキーへ上書きするため、誤操作・侵害からの復元手段としてバージョンを残す。
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # S3 のライフサイクルはプレフィックスの除外を表現できず、規則が重なると最短の期限が
          # 適用される。そのため保持対象を除外するのではなく、削除してよいオブジェクトだけに
          # notify.put_attachment() が lifecycle=expire タグを付ける。
          - Id: ExpireTaggedAttachments
            Status: Enabled
            ExpirationInDays: 400
            TagFilters:
              - Key: lifecycle
                Value: expire
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            # 現行バージョンを消した後に残る delete marker も掃除する
            ExpiredObjectDeleteMarker: true
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: Bucket

  SesConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub ${ProjectName}-${Env}
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: ConfigurationSet

  SesEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    DependsOn: OpsTopicPolicy
    Properties:
      ConfigurationSetName: !Ref SesConfigurationSet
      EventDestination:
        Name: ops-bounce-complaint
        Enabled: true
        MatchingEventTypes:
          - bounce
          - complaint
        SnsDestination:
          TopicARN: !Ref OpsTopic

  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref MailDomain
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref SesConfigurationSet
      DkimAttributes:
        SigningEnabled: true
      MailFromAttributes:
        MailFromDomain: !Sub bounce.${MailDomain}
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: EmailIdentity

  SesRecordSetGroup:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !GetAtt EmailIdentity.DkimDNSTokenName1
          Type: CNAME
          TTL: "1800"
          ResourceRecords:
            - !GetAtt EmailIdentity.DkimDNSTokenValue1
        - Name: !GetAtt EmailIdentity.DkimDNSTokenName2
          Type: CNAME
          TTL: "1800"
          ResourceRecords:
            - !GetAtt EmailIdentity.DkimDNSTokenValue2
        - Name: !GetAtt EmailIdentity.DkimDNSTokenName3
          Type: CNAME
          TTL: "1800"
          ResourceRecords:
            - !GetAtt EmailIdentity.DkimDNSTokenValue3
        - Name: !Sub bounce.${MailDomain}
          Type: MX
          TTL: "1800"
          ResourceRecords:
            - 10 feedback-smtp.ap-northeast-1.amazonses.com
        - Name: !Sub bounce.${MailDomain}
          Type: TXT
          TTL: "300"
          ResourceRecords:
            - '"v=spf1 include:amazonses.com ~all"'
        - Name: !Sub _dmarc.${MailDomain}
          Type: TXT
          TTL: "300"
          ResourceRecords:
            - '"v=DMARC1; p=quarantine;"'

  NotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-core-notifier-${Env}
      Description: notify-queue のメッセージを SES と Slack へ送る
      CodeUri: src/notifier/
      Handler: app.handler
      MemorySize: 512
      Timeout: 60
      Layers:
        - !Ref ExamplePowertoolsLayerArn
        - !Ref PowertoolsLayerArn
        - !Ref SharedLayerArn
      Environment:
        Variables:
          ENV: !Ref Env
          LOG_LEVEL: !Ref LogLevel
          POWERTOOLS_SERVICE_NAME: notifier
          SES_FROM_ADDRESS: !Sub noreply@${MailDomain}
          IDEMPOTENCY_TABLE: !Ref IdempotencyTable
          DLQ_URL: !Ref NotifyDlq
          SSM_PREFIX: !Sub /${ProjectName}/${Env}
          # 宛先の許可ドメイン（カンマ区切り）。課金明細の社外配布を送信直前で止める
          ALLOWED_MAIL_DOMAINS: example.co.jp
      Events:
        NotifyQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt NotifyQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: SendEmailAsNoreply
              Effect: Allow
              Action: ses:SendEmail
              Resource:
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${MailDomain}
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${SesConfigurationSet}
              Condition:
                StringEquals:
                  ses:FromAddress: !Sub noreply@${MailDomain}
            - Sid: ReadAttachments
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:aws:s3:::${AttachmentsBucket}/*
            # ListBucket が無いと存在しないキーの GetObject が 404 でなく AccessDenied になり、
            # 添付欠落を恒久エラー（DLQ 直行）と判定できない
            - Sid: LocateAttachments
              Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub arn:aws:s3:::${AttachmentsBucket}
            - Sid: ReadSlackSecrets
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Env}/shared/slack/*
            - Sid: DecryptSlackSecrets
              Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
                ForAnyValue:StringEquals:
                  kms:ResourceAliases: alias/aws/ssm
            - Sid: IdempotencyRecords
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt IdempotencyTable.Arn
            - Sid: ParkPermanentFailures
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt NotifyDlq.Arn

  NotifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${NotifierFunction}
      RetentionInDays: 365
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: LogGroup

  NotifyQueueUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ProjectName}/${Env}/notify/queue-url
      Type: String
      Value: !Ref NotifyQueue
      Description: 通知キュー URL。app の Lambda 環境変数と shared notify.py が読む

  NotifyQueueArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ProjectName}/${Env}/notify/queue-arn
      Type: String
      Value: !GetAtt NotifyQueue.Arn
      Description: 通知キュー ARN。app の IAM sqs:SendMessage の Resource が読む

  AttachmentsBucketParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ProjectName}/${Env}/attachments/bucket
      Type: String
      Value: !Ref AttachmentsBucket
      Description: 添付バケット名。app が添付を置く先と IAM の Resource が読む

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref SignInUserPool
  UserPoolClientId:
    Description: SPA 用 App Client ID
    Value: !Ref UserPoolClient
