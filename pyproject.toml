[project]
name = "service-platform"
version = "0.1.0"
description = "統合サービス基盤 SERVICE-PLATFORM のバックエンド"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "moto[dynamodb,s3,sqs,ssm,ses,cognitoidp,stepfunctions]>=5.1",
    "responses>=0.25",
    "jsonschema>=4.23",
    "boto3>=1.37.27",
    "aws-lambda-powertools>=3.7",
    "ruff>=0.9",
    "pycognito>=2024.5",
    "cfn-lint>=1.51.3",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "infra/core/tests", "tests/infra", "apps"]
pythonpath = ["shared/layers", "infra/core/src", "apps/admin-users/functions"]
addopts = "-ra --strict-markers --import-mode=importlib"
filterwarnings = ["error::DeprecationWarning:service_platform.*"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/.venv/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    ".venv",
    ".aws-sam",
    "node_modules",
    "frontend",
    "*.md",
    # 使い捨ての PoC。配備しない。poc/cognito/README の手順で動かす
    "poc",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["service_platform"]
