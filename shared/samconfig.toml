version = 0.1

[default.build.parameters]
use_container = true

[default.deploy.parameters]
stack_name = "service-platform-shared-dev"
region = "ap-northeast-1"
s3_bucket = "example-sam-ap-northeast-1"
s3_prefix = "service-platform-shared-dev"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
tags = "Project=service-platform App=shared Env=dev"
parameter_overrides = "ProjectName=service-platform Env=dev SlackMode=bot"

[production.build.parameters]
use_container = true

[production.deploy.parameters]
stack_name = "service-platform-shared-prod"
region = "ap-northeast-1"
s3_bucket = "example-sam-ap-northeast-1"
s3_prefix = "service-platform-shared-prod"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
tags = "Project=service-platform App=shared Env=prod"
parameter_overrides = "ProjectName=service-platform Env=prod SlackMode=bot"
