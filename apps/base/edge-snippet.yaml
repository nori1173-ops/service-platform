# infra/edge/template.yaml に転記する断片（ADD-APP-GUIDE「edge の API 経路と配備スクリプト」/ DESIGN 5.2）。
# base は転記済みなので、下は edge テンプレートに入っている実物の写し。
#
# scripts/deploy-edge.sh も追記済み（BASE_API_DOMAIN_PARAM の解決と OVERRIDES への連結）。
# /service-platform/{env}/apps/base/api-domain を読み、値があれば
# BaseApiDomain=<読んだ値> を parameter_overrides に足す。
#
# samconfig.toml に SSM のキーパスを書くのは誤り。下のパラメータは Type: String なので、
# キーパスの文字列がそのまま origin の DomainName になり、API 経路が壊れる
#（SSM から解決されるのは Type: AWS::SSM::Parameter::Value<String> のパラメータだけ）。
#
# origin も behavior も「リストの要素ごとに !If」で書く。edge テンプレートの Origins /
# CacheBehaviors は既にこの形（ で書き換え済み）なので、下をそのまま末尾に足せばよい。
#     CacheBehaviors: !If [HasXxxApi, [<behavior>], !Ref AWS::NoValue]
# のようにリスト全体を !If にすると、後から足した behavior が他アプリの Condition に
# 巻き込まれる。origin だけ消えて behavior が残ればデプロイが失敗し、CacheBehaviors ごと
# 消えれば /api/{app}/* が SPA へフォールスルーする。この形へ戻さないこと。

# --- Parameters に追加 -------------------------------------------------------
Parameters:
  BaseApiDomain:
    Type: String
    Default: ""
    Description: 土台 base の HTTP API ドメイン（設計 4.2 の /apps/base/api-domain）。空なら API 経路を作らない

# --- Conditions に追加 -------------------------------------------------------
Conditions:
  HasBaseApi: !Not [!Equals [!Ref BaseApiDomain, ""]]

# --- Distribution の Origins に追加 -----------------------------------------
          - !If
            - HasBaseApi
            - Id: api-base
              DomainName: !Ref BaseApiDomain
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols:
                  - TLSv1.2
              OriginCustomHeaders:
                - HeaderName: x-origin-verify
                  HeaderValue: !Ref OriginVerifySecret
            - !Ref AWS::NoValue

# --- Distribution の CacheBehaviors に追加 ----------------------------------
# origin と同じ Condition を要素ごとに付ける（上の「2 アプリ目以降の注意」を参照）。
# API の behavior には CloudFront Function を付けない（SPA フォールバックは default behavior だけ）。
# AllowedMethods は 7 メソッドを明示する（省略すると GET / HEAD だけになり POST が 403）。
          - !If
            - HasBaseApi
            - PathPattern: /api/base/*
              TargetOriginId: api-base
              ViewerProtocolPolicy: https-only
              AllowedMethods:
                - GET
                - HEAD
                - OPTIONS
                - PUT
                - PATCH
                - POST
                - DELETE
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
              Compress: true
            - !Ref AWS::NoValue
