version = 0.1

[default.build.parameters]
use_container = true

# 外部通信機 API と活動台帳は対象環境に合わせて指定する。
[default.deploy.parameters]
stack_name = "service-platform-app-base-dev"
region = "ap-northeast-1"
s3_bucket = "example-sam-ap-northeast-1"
s3_prefix = "service-platform-app-base-dev"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
tags = "Project=service-platform App=base Env=dev"
parameter_overrides = "ProjectName=service-platform Env=dev LogLevel=DEBUG ExamplePowertoolsLayerArn=arn:aws:lambda:ap-northeast-1:210000000001:layer:ExamplePowertoolsPython:1 PowertoolsLayerArn=arn:aws:lambda:ap-northeast-1:210000000001:layer:AWSLambdaPowertoolsPythonV3-python313-x86_64:37 UserPoolIssuer=/service-platform/dev/cognito/issuer UserPoolClientId=/service-platform/dev/cognito/client-id UserPoolId=/service-platform/dev/cognito/user-pool-id SharedLayerArn=/service-platform/dev/shared/layer-arn LedgerTableName=/service-platform/dev/ledger/table-name AuditTableName=/service-platform/dev/audit/table-name DeviceBackendApiBaseUrl=https://backend.example-cloud.com DeviceActivityTableNameParameter=/service-platform/dev/devices/activity-table-name"

[production.build.parameters]
use_container = true

# prod で上書きするのは SSM の「キー名」であり、値ではない（設計 4.4 / 13.2）。
[production.deploy.parameters]
stack_name = "service-platform-app-base-prod"
region = "ap-northeast-1"
s3_bucket = "example-sam-ap-northeast-1"
s3_prefix = "service-platform-app-base-prod"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
tags = "Project=service-platform App=base Env=prod"
parameter_overrides = "ProjectName=service-platform Env=prod LogLevel=INFO ExamplePowertoolsLayerArn=arn:aws:lambda:ap-northeast-1:210000000001:layer:ExamplePowertoolsPython:1 PowertoolsLayerArn=arn:aws:lambda:ap-northeast-1:210000000001:layer:AWSLambdaPowertoolsPythonV3-python313-x86_64:37 UserPoolIssuer=/service-platform/prod/cognito/issuer UserPoolClientId=/service-platform/prod/cognito/client-id UserPoolId=/service-platform/prod/cognito/user-pool-id SharedLayerArn=/service-platform/prod/shared/layer-arn LedgerTableName=/service-platform/prod/ledger/table-name AuditTableName=/service-platform/prod/audit/table-name DeviceBackendApiBaseUrl=https://backend.example-cloud.com DeviceActivityTableNameParameter=/service-platform/prod/devices/activity-table-name"
